name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --clean ABIRoute.spec

      - name: Upload artifact (каждый пуш)
        uses: actions/upload-artifact@v4
        with:
          name: ABIRoute
          path: dist/ABIRoute.exe

      - name: Create release (на теге v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/ABIRoute.exe --clobber
          else
            gh release create "${{ github.ref_name }}" dist/ABIRoute.exe `
              --title "ABI Route ${{ github.ref_name }}" `
              --generate-notes
          fi

name: build-exe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - name: Тесты
        run: python -m unittest discover -s tests -v
      - name: Сборка exe
        run: pyinstaller --noconfirm --clean ABIRoute.spec
      - uses: actions/upload-artifact@v4
        with: { name: ABIRoute, path: dist/ABIRoute.exe }
      # Снимки интерфейса на настоящей Windows (демо-данные, без сети и туннеля)
      - name: Экран 1920×1080
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Снимки интерфейса
        timeout-minutes: 5
        run: |
          pip install pillow
          python abi_route.py --screenshot screenshots
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: screenshots/ }
